---
rule_files:
  - ../rules/velero.yaml

evaluation_interval: 1h

tests:
  - interval: 1h
    input_series:
      - series: velero_backup_last_successful_timestamp{schedule="pv-backup"}
        values: 3600x48


    promql_expr_test:
      - expr: velero_backup_last_successful_timestamp
        eval_time: 1h
        exp_samples:
          - labels: velero_backup_last_successful_timestamp{schedule="pv-backup"}
            value: 3600
      - expr: velero_backup_last_successful_timestamp
        eval_time: 2h
        exp_samples:
          - labels: velero_backup_last_successful_timestamp{schedule="pv-backup"}
            value: 3600
      - expr: backup:velero_backup_last_successful_timestamp:as_hours
        eval_time: 1h
        exp_samples:
          - labels: backup:velero_backup_last_successful_timestamp:as_hours{schedule="pv-backup"}
            value: 0
      - expr: backup:velero_backup_last_successful_timestamp:as_hours
        eval_time: 3h
        exp_samples:
          - labels: backup:velero_backup_last_successful_timestamp:as_hours{schedule="pv-backup"}
            value: 2
      - expr: backup:velero_backup_last_successful_timestamp:as_hours
        eval_time: 6h
        exp_samples:
          - labels: backup:velero_backup_last_successful_timestamp:as_hours{schedule="pv-backup"}
            value: 5

    alert_rule_test:
      - eval_time: 3h
        alertname: velero-volume-backup-failure
        exp_alerts: []

      - eval_time: 28h
        alertname: velero-volume-backup-failure
        exp_alerts:
          - exp_annotations:
              summary: Last successful persistent volume backup has exceeded the threshold
              dashboard: /d/velero
            exp_labels:
              group: velero
              severity: high
              receiver: slack
              schedule: pv-backup

  # Velero restarted: no gauge until the next successful backup
  - interval: 1h
    input_series:
      - series: up{job="metrics/velero"}
        values: 1x30

    alert_rule_test:
      - eval_time: 25h
        alertname: velero-volume-backup-missing
        exp_alerts: []
      - eval_time: 27h
        alertname: velero-volume-backup-missing
        exp_alerts:
          - exp_annotations:
              summary: No successful persistent volume backup since velero started
              dashboard: /d/velero
            exp_labels:
              group: velero
              severity: high
              receiver: slack
              schedule: pv-backup
      - eval_time: 27h
        alertname: velero-metrics-absent
        exp_alerts: []

  # Velero down, then gone from discovery
  - interval: 15m
    input_series:
      - series: up{job="metrics/velero"}
        values: 1 1 0 0 0 0 _ _ _ _
      - series: velero_backup_last_successful_timestamp{schedule="pv-backup"}
        values: 0x9

    alert_rule_test:
      # Rules are evaluated hourly here: pending at 1h, firing at 2h
      - eval_time: 1h
        alertname: velero-metrics-absent
        exp_alerts: []
      - eval_time: 2h
        alertname: velero-metrics-absent
        exp_alerts:
          - exp_annotations:
              summary: Velero has disappeared from Prometheus target discovery
              dashboard: /d/velero
            exp_labels:
              group: velero
              severity: high
              receiver: slack
      - eval_time: 2h
        alertname: velero-volume-backup-missing
        exp_alerts: []
