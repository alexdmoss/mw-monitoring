groups:
  - name: velero
    rules:
      - record: backup:velero_backup_last_successful_timestamp:as_hours
        expr: (time() - velero_backup_last_successful_timestamp) / 3600
      - alert: velero-volume-backup-failure
        annotations:
          summary: Last successful persistent volume backup has exceeded the threshold
          dashboard: /d/velero
        expr: backup:velero_backup_last_successful_timestamp:as_hours{schedule="pv-backup"} > 24
        for: 2h
        labels:
          group: velero
          severity: high
          receiver: slack
      # The rule above goes quiet if the metric disappears. Velero only sets
      # the gauge after a successful backup, so after a restart it is missing
      # until the next one: allow the 24h schedule plus the usual 2h.
      - alert: velero-volume-backup-missing
        annotations:
          summary: No successful persistent volume backup since velero started
          dashboard: /d/velero
        expr: absent(velero_backup_last_successful_timestamp{schedule="pv-backup"})
        for: 26h
        labels:
          group: velero
          severity: high
          receiver: slack
      - alert: velero-metrics-absent
        annotations:
          summary: Velero has disappeared from Prometheus target discovery
          dashboard: /d/velero
        expr: absent(up{job="metrics/velero"} == 1)
        for: 30m
        labels:
          group: velero
          severity: high
          receiver: slack
