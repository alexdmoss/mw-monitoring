---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kyverno
  namespace: metrics
spec:
  endpoints:
  - interval: 30s
    path: /metrics
    port: metrics-port
  jobLabel: kyverno
  namespaceSelector:
    matchNames:
    - kyverno
  # Since chart v3 each controller has its own name label
  # (kyverno-admission-controller, kyverno-background-controller), so select
  # on part-of. Only the *-metrics Services have the metrics-port endpoint.
  selector:
    matchLabels:
      app.kubernetes.io/instance: kyverno
      app.kubernetes.io/part-of: kyverno
