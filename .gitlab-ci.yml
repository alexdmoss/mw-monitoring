workflow:
  rules:
    # Avoid duplicate pipelines: the branch pipeline already runs the jobs,
    # so don't also create a merge request pipeline.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
  - release
  - smoke

variables:
  DOMAIN: grafana.alexos.dev
  GRAFANA_PASS: ${GRAFANA_PASSWORD}
  NAMESPACE: metrics
  WEBHOOK_IMAGE_NAME: europe-docker.pkg.dev/${GCP_PROJECT_ID}/alexos/alertmanager-test-webhook
  # Images outside Docker Hub use github-releases, so the 3-day age gate has a
  # release timestamp to work from.
  # renovate: datasource=github-releases depName=prometheus/prometheus
  PROMETHEUS_VERSION: v3.15.1
  # renovate: datasource=github-releases depName=prometheus/alertmanager
  ALERTMANAGER_VERSION: v0.32.1
  # renovate: datasource=github-releases depName=kubernetes/kube-state-metrics
  KUBE_STATE_METRICS_VERSION: v2.20.0
  # renovate: datasource=github-releases depName=prometheus/node_exporter
  NODE_EXPORTER_VERSION: v1.12.1
  # renovate: datasource=docker depName=grafana/grafana
  GRAFANA_VERSION: 13.1.0

.k8s:
  image: al3xos/ci-tools:latest
  before_script:
    - region=$(gcloud container clusters list --project=${GCP_PROJECT_ID} --filter "NAME=${CLUSTER_NAME}" --format "value(location)")
    - gcloud container clusters get-credentials "${CLUSTER_NAME}" --region "${region}" --project "${GCP_PROJECT_ID}"

# Every branch, main included, before anything is applied: the alert rule
# conventions, rendered manifests and the webhook image build.
validate:
  stage: validate
  image: al3xos/ci-tools:latest
  script:
    - (cd alerts/ && uv run ./render-rules.py)
    - ./scripts/validate-manifests.sh prometheus alertmanager kube-state-metrics kubelet node-exporter service-monitors test-webhook /tmp/alert-rules.yaml
    - alexos-cli build --image-name=$WEBHOOK_IMAGE_NAME --dockerfile=webhook.Dockerfile --backend=buildkit --disable-push

# promtool from the same Prometheus release that's deployed
test-alerts:
  stage: validate
  image:
    name: quay.io/prometheus/prometheus:${PROMETHEUS_VERSION}
    entrypoint: [ "/bin/sh", "-c" ]
  script:
  - cd alerts/ && ./test-alerts.sh

webhook:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: al3xos/ci-tools:latest
  script:
    - alexos-cli build --image-name=$WEBHOOK_IMAGE_NAME --gcr-login --dockerfile=webhook.Dockerfile
    - alexos-cli scan code
    - alexos-cli scan secrets
    - alexos-cli scan container --image-name=$WEBHOOK_IMAGE_NAME
    - alexos-cli scan iac
    - alexos-cli deploy kubernetes --image-name=$WEBHOOK_IMAGE_NAME --namespace=$NAMESPACE --manifests=test-webhook

telemetry:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: al3xos/ci-tools:latest
  script:
    - alexos-cli deploy kubernetes --manifests=prometheus --namespace=$NAMESPACE --image-name=required-but-not-used --skip-rollout-check --envvars=PROMETHEUS_VERSION
    - kubectl rollout status sts/prometheus-mw -n=$NAMESPACE --timeout=120s
    - alexos-cli deploy kubernetes --manifests=kube-state-metrics --namespace=$NAMESPACE --image-name="registry.k8s.io/kube-state-metrics/kube-state-metrics" --image-tag="${KUBE_STATE_METRICS_VERSION}"
    - alexos-cli deploy kubernetes --manifests=kubelet --namespace=$NAMESPACE --image-name=required-but-not-used
    - alexos-cli deploy kubernetes --manifests=node-exporter --namespace=$NAMESPACE --image-name="quay.io/prometheus/node-exporter" --image-tag="${NODE_EXPORTER_VERSION}-distroless"
    - alexos-cli deploy kubernetes --manifests=service-monitors --namespace=$NAMESPACE --image-name=required-but-not-used

grafana:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: al3xos/ci-tools:latest
  script:
    - echo "GF_SECURITY_ADMIN_USER=admin" > ./grafana/secret.tmp
    - echo "GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS}" >> ./grafana/secret.tmp
    - alexos-cli deploy kubernetes --manifests=grafana --image-name="grafana/grafana" --image-tag="${GRAFANA_VERSION}" --namespace=$NAMESPACE --skip-rollout-check
    - rm ./grafana/secret.tmp
    - sleep 30
    - alexos-cli deploy kubernetes --manifests=dashboards --namespace=$NAMESPACE --image-name=required-but-not-used --skip-rollout-check

alerts:
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  image: al3xos/ci-tools:latest
  script: |

    SECRET_CONFIG=$(gcloud secrets versions access latest --secret="alert-manager" --project="${GCP_PROJECT_ID}")
    IAP_CLIENT_ID=$(echo "${SECRET_CONFIG}" | grep IAP_CLIENT_ID | awk -F= '{print $2}')
    SLACK_WEBHOOK_URL=$(echo "${SECRET_CONFIG}" | grep SLACK_WEBHOOK_URL | awk -F= '{print $2}')
    ALERTMANAGER_EMAIL_HOST=$(echo "${SECRET_CONFIG}" | grep ALERTMANAGER_EMAIL_HOST | awk -F= '{print $2}')
    ALERTMANAGER_EMAIL_USER=$(echo "${SECRET_CONFIG}" | grep ALERTMANAGER_EMAIL_USER | awk -F= '{print $2}')
    ALERTMANAGER_EMAIL_PASS=$(echo "${SECRET_CONFIG}" | grep ALERTMANAGER_EMAIL_PASS | awk -F= '{print $2}')
    export IAP_CLIENT_ID SLACK_WEBHOOK_URL ALERTMANAGER_EMAIL_HOST ALERTMANAGER_EMAIL_USER ALERTMANAGER_EMAIL_PASS

    alexos-cli deploy kubernetes \
      --manifests=alertmanager --namespace=$NAMESPACE \
      --image-name=required-but-not-used --skip-rollout-check \
      --envvars IAP_CLIENT_ID,ALERTMANAGER_EMAIL_HOST,ALERTMANAGER_EMAIL_USER,ALERTMANAGER_EMAIL_PASS,SLACK_WEBHOOK_URL,ALERTMANAGER_VERSION
    sleep 5
    kubectl rollout restart sts/alertmanager-mw -n=$NAMESPACE
    kubectl rollout status sts/alertmanager-mw -n=$NAMESPACE --timeout=120s

    cd alerts/
    uv venv
    uv run ./render-rules.py
    kubectl apply -f /tmp/alert-rules.yaml

# Every workload in the namespace rolled out, and the Prometheus and
# Alertmanager CRs report Available.
smoke-test:
  stage: smoke
  extends: .k8s
  needs:
    - telemetry
    - grafana
    - alerts
    - webhook
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - ./scripts/smoke-test.sh
